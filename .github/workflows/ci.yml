name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch optional CJK fonts
        run: bash scripts/fetch-cjk-fonts.sh

      - name: Build (excluding Python extension)
        run: cargo build --workspace --exclude pdfgen-py

      - name: Test
        run: cargo test --workspace --exclude pdfgen-py

      - name: Clippy (blocking)
        run: cargo clippy --workspace --exclude pdfgen-py --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint commit messages (Conventional Commits)
        if: matrix.os == 'ubuntu-latest'
        run: |
          RANGE="${{ github.event.pull_request.base.sha || 'origin/main~50' }}..HEAD"
          git log --format='%s' "$RANGE" 2>/dev/null |
          grep -vE '^(feat|fix|docs|chore|refactor|test|style|perf|build|ci|revert)(\(.+\))?: .+$' |
          grep -q . && { echo "Non-conventional commit subjects found:"; git log --format='%s' "$RANGE" | grep -vE '^(feat|fix|docs|chore|refactor|test|style|perf|build|ci|revert)(\(.+\))?: .+$' | head; exit 1; } || echo "commit style OK"

  verapdf:
    name: veraPDF gate (UA-1 + UA-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch optional CJK fonts
        run: bash scripts/fetch-cjk-fonts.sh

      - name: Generate every tests/output fixture
        run: cargo test --workspace --exclude pdfgen-py

      - name: Install veraPDF
        run: |
          mkdir -p tools/verapdf
          curl -fsSL -o /tmp/verapdf-installer.zip \
            "http://downloads.verapdf.org/rel/verapdf-installer.zip"
          unzip -q /tmp/verapdf-installer.zip -d /tmp/verapdf-dl
          cat > /tmp/verapdf-dl/auto-install.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.HTMLHelloPanel id="hello"/>
            <com.izforge.izpack.panels.LicencePanel id="license"/>
            <com.izforge.izpack.panels.TargetPanel id="target">
              <installpath>tools/verapdf</installpath>
            </com.izforge.izpack.panels.TargetPanel>
            <com.izforge.izpack.panels.PacksPanel id="packs">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="Mac/*nix Scripts" selected="true"/>
              <pack index="2" name="Validation model" selected="true"/>
              <pack index="3" name="Documentation" selected="true"/>
              <pack index="4" name="Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.PacksPanel>
            <com.izforge.izpack.panels.InstallPanel id="install"/>
            <com.izforge.izpack.panels.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          JAR=$(ls /tmp/verapdf-dl/verapdf-izpack-installer-*.jar | head -1)
          java -jar "$JAR" /tmp/verapdf-dl/auto-install.xml

      - name: Validate every generated PDF (fail on any failed check)
        run: bash scripts/verapdf-gate.sh
