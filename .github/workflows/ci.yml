name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch optional CJK fonts
        run: bash scripts/fetch-cjk-fonts.sh

      - name: Build (excluding Python extension)
        run: cargo build --workspace --exclude pdfgen-py

      - name: Test
        run: cargo test --workspace --exclude pdfgen-py

      - name: Clippy (blocking)
        run: cargo clippy --workspace --exclude pdfgen-py --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint commit messages (Conventional Commits)
        if: matrix.os == 'ubuntu-latest'
        run: |
          RANGE="${{ github.event.pull_request.base.sha || 'origin/main~50' }}..HEAD"
          git log --format='%s' "$RANGE" 2>/dev/null |
          grep -vE '^(feat|fix|docs|chore|refactor|test|style|perf|build|ci|revert)(\(.+\))?: .+$' |
          grep -q . && { echo "Non-conventional commit subjects found:"; git log --format='%s' "$RANGE" | grep -vE '^(feat|fix|docs|chore|refactor|test|style|perf|build|ci|revert)(\(.+\))?: .+$' | head; exit 1; } || echo "commit style OK"

  verapdf:
    name: veraPDF gate (UA-1 + UA-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch optional CJK fonts
        run: bash scripts/fetch-cjk-fonts.sh

      - name: Generate every tests/output fixture
        run: cargo test --workspace --exclude pdfgen-py

      - name: Install veraPDF (pinned to 1.30.2)
        run: |
          mkdir -p tools/verapdf
          # Pinned, not "latest": the README cites 1.30.2 and the gate
          # must validate against the same version every run.
          curl -fsSL -o /tmp/verapdf-installer.zip \
            "https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.2-installer.zip"
          unzip -q /tmp/verapdf-installer.zip -d /tmp/verapdf-dl
          # Panel FQNs and pack names must match the installer's own
          # recorded auto-install XML exactly, or izpack fails silently.
          cat > /tmp/verapdf-dl/auto-install.xml <<'XML'
          <AutomatedInstallation langpack="eng">
          <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
          <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
          <installpath>/home/runner/work/PDFgen/PDFgen/tools/verapdf</installpath>
          </com.izforge.izpack.panels.target.TargetPanel>
          <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
          <pack index="0" name="veraPDF GUI" selected="true"/>
          <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
          <pack index="2" name="veraPDF Validation model" selected="true"/>
          <pack index="3" name="veraPDF Documentation" selected="true"/>
          <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
          </com.izforge.izpack.panels.packs.PacksPanel>
          <com.izforge.izpack.panels.install.InstallPanel id="install"/>
          <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          JAR=$(find /tmp/verapdf-dl -name 'verapdf-izpack-installer-*.jar' | head -1)
          java -jar "$JAR" /tmp/verapdf-dl/auto-install.xml
          # Hard version gate: the pinned download must be exactly 1.30.2.
          tools/verapdf/verapdf --version | head -1 | grep -qx 'veraPDF 1.30.2' \
            || { echo "veraPDF version mismatch (expected 1.30.2)" >&2; exit 1; }
          tools/verapdf/verapdf --version

      - name: Validate every generated PDF (fail on any failed check)
        run: bash scripts/verapdf-gate.sh
