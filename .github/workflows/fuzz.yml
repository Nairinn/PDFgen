name: Fuzz

# Nightly fuzzing of every cargo-fuzz target: each target runs for 5
# minutes on nightly Rust. Crash artifacts upload on failure so a
# nightly repro is a download away.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {} # manual trigger

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [font_loader, pdf_reader]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: cargo-fuzz

      - name: Fuzz for 5 minutes
        run: |
          cd fuzz
          cargo fuzz run ${{ matrix.target }} \
            -- -max_total_time=300 -rss_limit_mb=4096 -timeout=10

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/corpus/${{ matrix.target }}/crash-*
            fuzz/corpus/${{ matrix.target }}/oom-*
            fuzz/corpus/${{ matrix.target }}/timeout-*
          if-no-files-found: info
          retention-days: 30
