<head>
  <title>Fidelity fixture</title>
  <style>body { color: red; }</style>
  <script>var x = "should not appear";</script>

<body>
  <!-- this is a comment that must not appear -->
  <h2>Numeric entities</h2>
  <p>Caf&#233; — an &#x2014; em dash, and &amp; still works.</p>

  <div>Implied paragraph text inside a div</div>
  Loose body text here too
  <h2>Ordered list</h2>

    <li>first</li>
    <li>second</li>
  </ol>
  <h2>Relative image</h2>
  <img src="img/red_box.png" alt="A red box">

  <p>a forced line break<br>in one paragraph</p>
</body>
</html>
