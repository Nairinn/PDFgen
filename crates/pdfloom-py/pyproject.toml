[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pdfloom"
description = "Python bindings for PDFloom: tagged PDF/UA documents from Rust"
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
]
