[workspace]
resolver = "2"
members = [
    "crates/pdfloom-core",
    "crates/pdfloom-parse",
    "crates/pdfloom-font",
    "crates/pdfloom-fonts",
    "crates/pdfloom-canvas",
    "crates/pdfloom-profile",
    "crates/pdfloom",
    "crates/pdfloom-api",
    "crates/pdfloom-py",
    "crates/pdfloom-uniffi",
    "crates/pdfloom-validate",
    "crates/pdfloom-cli",
    "crates/pdfloom-revision",
    "crates/pdfloom-draw",
    "crates/pdfloom-ffi",
    "crates/pdfloom-render",
    "crates/pdfloom-def",
    "crates/pdfloom-server",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Nairinn/PDFloom"
rust-version = "1.82"

[workspace.dependencies]
pdfloom-core = { path = "crates/pdfloom-core", version = "0.1.0" }
pdfloom-font = { path = "crates/pdfloom-font", version = "0.1.0" }
pdfloom-fonts = { path = "crates/pdfloom-fonts", version = "0.1.0" }
pdfloom-canvas = { path = "crates/pdfloom-canvas", version = "0.1.0" }
pdfloom-profile = { path = "crates/pdfloom-profile", version = "0.1.0" }
pdfloom-parse = { path = "crates/pdfloom-parse", version = "0.1.0" }
pdfloom = { path = "crates/pdfloom", version = "0.1.0" }
pdfloom-api = { path = "crates/pdfloom-api", version = "0.1.0" }
pdfloom-validate = { path = "crates/pdfloom-validate", version = "0.1.0" }
pdfloom-revision = { path = "crates/pdfloom-revision", version = "0.1.0" }
pdfloom-draw = { path = "crates/pdfloom-draw", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
rustybuzz = "0.20"
unicode-bidi = "0.3"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Doc-formatting nits (backticks, # Errors/# Safety sections): high
# volume, zero behavior. Track as a follow-up.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
# Narrowing casts are endemic in binary-format code (u64 -> u32 object
# ids, usize -> u16 glyph ids); each is audited by the reader's bounds
# checks and the fuzz corpus instead.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
# Builder-style APIs return &mut Self chains; must_use on every getter
# is noise we do not want per-item.
# The StreamWriter deliberately builds strings by push (hot loops with
# reused buffers); format! there would allocate more.
format_push_string = "allow"
# Several public APIs take &str/usize by value for binding ergonomics.
needless_pass_by_value = "allow"
# Style-level pedantic lints: real fixes tracked as follow-up; not
# worth blocking the gate on naming/structure preferences.
too_many_lines = "allow"
too_many_arguments = "allow"
similar_names = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
drop_non_drop = "allow"
unused_self = "allow"
needless_return = "allow"
result_unit_err = "allow"


[profile.release]
lto = "thin"
