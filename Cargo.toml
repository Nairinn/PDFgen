[workspace]
resolver = "2"
members = [
    "crates/pdfgen-core",
    "crates/pdfgen-parse",
    "crates/pdfgen-font",
    "crates/pdfgen-fonts",
    "crates/pdfgen-canvas",
    "crates/pdfgen-profile",
    "crates/pdfgen",
    "crates/pdfgen-api",
    "crates/pdfgen-py",
    "crates/pdfgen-uniffi",
    "crates/pdfgen-validate",
    "crates/pdfgen-cli",
    "crates/pdfgen-revision",
    "crates/pdfgen-draw",
    "crates/pdfgen-ffi",
    "crates/pdfgen-render",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Nairinn/PDFgen"
rust-version = "1.82"

[workspace.dependencies]
pdfgen-core = { path = "crates/pdfgen-core", version = "0.1.0" }
pdfgen-font = { path = "crates/pdfgen-font", version = "0.1.0" }
pdfgen-fonts = { path = "crates/pdfgen-fonts", version = "0.1.0" }
pdfgen-canvas = { path = "crates/pdfgen-canvas", version = "0.1.0" }
pdfgen-profile = { path = "crates/pdfgen-profile", version = "0.1.0" }
pdfgen-parse = { path = "crates/pdfgen-parse", version = "0.1.0" }
pdfgen = { path = "crates/pdfgen", version = "0.1.0" }
pdfgen-api = { path = "crates/pdfgen-api", version = "0.1.0" }
pdfgen-validate = { path = "crates/pdfgen-validate", version = "0.1.0" }
pdfgen-revision = { path = "crates/pdfgen-revision", version = "0.1.0" }
pdfgen-draw = { path = "crates/pdfgen-draw", version = "0.1.0" }
ttf-parser = "0.25"
rustybuzz = "0.20"
unicode-bidi = "0.3"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Doc-formatting nits (backticks, # Errors/# Safety sections): high
# volume, zero behavior. Track as a follow-up.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
# Narrowing casts are endemic in binary-format code (u64 -> u32 object
# ids, usize -> u16 glyph ids); each is audited by the reader's bounds
# checks and the fuzz corpus instead.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
# Builder-style APIs return &mut Self chains; must_use on every getter
# is noise we do not want per-item.
# The StreamWriter deliberately builds strings by push (hot loops with
# reused buffers); format! there would allocate more.
format_push_string = "allow"
# Several public APIs take &str/usize by value for binding ergonomics.
needless_pass_by_value = "allow"
# Style-level pedantic lints: real fixes tracked as follow-up; not
# worth blocking the gate on naming/structure preferences.
too_many_lines = "allow"
too_many_arguments = "allow"
similar_names = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
drop_non_drop = "allow"
unused_self = "allow"
needless_return = "allow"
result_unit_err = "allow"


[profile.release]
lto = "thin"
