[workspace]
resolver = "2"
members = [
    "crates/pdfgen-core",
    "crates/pdfgen-parse",
    "crates/pdfgen-font",
    "crates/pdfgen-fonts",
    "crates/pdfgen-canvas",
    "crates/pdfgen-profile",
    "crates/pdfgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Nairinn/PDFgen"
rust-version = "1.82"

[workspace.dependencies]
pdfgen-core = { path = "crates/pdfgen-core", version = "0.1.0" }
pdfgen-font = { path = "crates/pdfgen-font", version = "0.1.0" }
pdfgen-fonts = { path = "crates/pdfgen-fonts", version = "0.1.0" }
pdfgen-canvas = { path = "crates/pdfgen-canvas", version = "0.1.0" }
pdfgen-profile = { path = "crates/pdfgen-profile", version = "0.1.0" }
pdfgen-parse = { path = "crates/pdfgen-parse", version = "0.1.0" }
ttf-parser = "0.25"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
